<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlowBoard — Kanban Task Board</title><link rel="stylesheet" href="style.css"></head><body><main class="app">
<header class="topbar"><div><p class="eyebrow">PLAN LESS. DO MORE.</p><h1>FlowBoard <span>✦</span></h1><p class="subtitle">A clear space for your next win.</p></div><button id="themeBtn" class="theme-btn" aria-label="Toggle dark mode">◐</button></header>
<section class="toolbar"><div><h2>Your workspace</h2><p class="muted">Move tasks through each stage.</p></div><button id="addTaskBtn" class="primary-btn">＋ Add task</button></section>
<form id="taskForm" class="task-form hidden"><div class="form-title"><h3 id="formHeading">Add a task</h3><button id="closeFormBtn" type="button" class="close-btn">×</button></div>
<label for="taskTitle">Task title</label><input id="taskTitle" maxlength="90" placeholder="e.g. Finish portfolio homepage" required>
<label for="taskDescription">Description (optional)</label><textarea id="taskDescription" rows="2" placeholder="What needs to be done?"></textarea>
<div class="form-row"><div><label for="taskPriority">Priority</label><select id="taskPriority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></div><div><label for="taskDue">Due date</label><input id="taskDue" type="date"></div></div>
<div class="form-actions"><button id="cancelFormBtn" type="button" class="secondary-btn">Cancel</button><button type="submit" class="primary-btn">Save task</button></div></form>
<section class="board"><div class="column" data-status="todo"><div class="column-head"><div><i class="dot todo-dot"></i><h3>To do</h3><span id="todoCount" class="count">0</span></div><button class="column-add" data-add="todo">＋</button></div><div id="todoList" class="task-list"></div></div>
<div class="column" data-status="doing"><div class="column-head"><div><i class="dot doing-dot"></i><h3>In progress</h3><span id="doingCount" class="count">0</span></div><button class="column-add" data-add="doing">＋</button></div><div id="doingList" class="task-list"></div></div>
<div class="column" data-status="done"><div class="column-head"><div><i class="dot done-dot"></i><h3>Done</h3><span id="doneCount" class="count">0</span></div><button class="column-add" data-add="done">＋</button></div><div id="doneList" class="task-list"></div></div></section>
<footer>One task at a time <span>✦</span></footer></main><script src="script.js"></script></body></html>
